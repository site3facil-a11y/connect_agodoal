<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#06282d" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="70%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.7" />

  <!-- Sun Disc -->
  <circle cx="256" cy="220" r="88" fill="url(#sunGrad)" filter="url(#glow)" opacity="0.95" />
  
  <!-- Subtle Island Sand Dunes -->
  <path d="M100 370 Q190 320 280 350 T430 365 L430 420 L100 420 Z" fill="#134e4a" opacity="0.6" />

  <!-- Ocean Waves -->
  <path d="M70 380 Q130 360 200 380 T340 380 T442 380 C442 410 420 435 385 435 L127 435 C92 435 70 410 70 380 Z" fill="url(#seaGrad)" opacity="0.85" />
  <path d="M90 405 Q160 390 230 405 T370 405 T422 415 C410 432 385 435 360 435 L152 435 C127 435 102 432 90 405 Z" fill="#042f2e" opacity="0.9" />

  <!-- Stylized Palm Tree (Algodoal Icon) -->
  <!-- Trunk -->
  <path d="M225 385 C230 330 250 270 285 220 C278 228 260 285 255 385 Z" fill="#d97706" />

  <!-- Palm Fronds (Leaves) -->
  <!-- Leaf 1: Top Left -->
  <path d="M285 215 C260 170 200 165 160 190 C185 200 230 205 285 215 Z" fill="url(#palmGrad)" />
  <!-- Leaf 2: High Arc Left -->
  <path d="M285 215 C270 150 215 130 185 140 C210 155 250 175 285 215 Z" fill="#2dd4bf" />
  <!-- Leaf 3: Top Center -->
  <path d="M285 215 C285 140 310 120 325 125 C320 145 305 175 285 215 Z" fill="#14b8a6" />
  <!-- Leaf 4: High Arc Right -->
  <path d="M285 215 C330 160 380 165 405 185 C375 195 330 200 285 215 Z" fill="url(#palmGrad)" />
  <!-- Leaf 5: Bottom Right -->
  <path d="M285 215 C345 215 390 240 400 270 C365 255 325 240 285 215 Z" fill="#0f766e" />
  <!-- Leaf 6: Bottom Left -->
  <path d="M285 215 C230 220 180 245 165 275 C195 260 245 240 285 215 Z" fill="#115e59" />

  <!-- Palm Coconuts / Accent -->
  <circle cx="282" cy="222" r="7" fill="#78350f" />
  <circle cx="292" cy="225" r="6" fill="#92400e" />

  <!-- Decorative Spark / Star -->
  <polygon points="380,130 384,142 396,146 384,150 380,162 376,150 364,146 376,142" fill="#fde047" opacity="0.9" />
</svg>
