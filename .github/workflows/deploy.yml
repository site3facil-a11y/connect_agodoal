name: Deploy Algodoal Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ec2-user/app

            echo "🔄 Sincronizando com a branch main..."
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data

            echo "📦 Reconstruindo containers com o código mais recente..."
            if command -v docker-compose &> /dev/null; then
              DOCKER_CMD="docker-compose"
            else
              DOCKER_CMD="docker compose"
            fi

            # Tenta rodar com docker ou com sudo se necessario
            if $DOCKER_CMD down 2>/dev/null; then
              $DOCKER_CMD up -d --build
            else
              sudo $DOCKER_CMD down
              sudo $DOCKER_CMD up -d --build
            fi

            echo "✅ Deploy concluído! Commit ativo: $(git rev-parse --short HEAD)"
