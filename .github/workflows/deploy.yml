name: Deploy Algodoal Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 45m
          command_timeout: 45m
          script: |
            set -e
            cd /home/ec2-user/app

            echo "🔄 Sincronizando com a branch main..."
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data

            echo "📦 Reconstruindo containers com o código mais recente..."
            if command -v docker-compose &> /dev/null; then
              DOCKER_CMD="docker-compose"
            else
              DOCKER_CMD="docker compose"
            fi

            # Compila e sobe com substituição contínua (sem downtime prévio)
            if sudo $DOCKER_CMD up -d --build --remove-orphans; then
              echo "✅ Containers iniciados com sucesso!"
            else
              echo "⚠️ Tentando sem sudo..."
              $DOCKER_CMD up -d --build --remove-orphans
            fi

            # Limpa imagens antigas e cache de build antigo para liberar espaço em disco na VPS
            echo "🧹 Limpando cache de build antigo e imagens não utilizadas..."
            sudo docker builder prune -a -f || docker builder prune -a -f || true
            sudo docker image prune -f || docker image prune -f || true

            echo "✅ Deploy concluído! Commit ativo: $(git rev-parse --short HEAD)"
