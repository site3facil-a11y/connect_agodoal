services:
  algodoal-connect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algodoal-connect-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@algodoal-postgres:5432/algodoal_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    networks:
      - app_default

networks:
  app_default:
    name: app_default
