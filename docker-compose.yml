services:
  algodoal-connect:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-algodoal-connect
    container_name: algodoal-connect-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@algodoal-postgres:5432/algodoal_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    depends_on:
      - postgres
    networks:
      - default

  postgres:
    image: postgres:16-alpine
    container_name: algodoal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algodoal_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - default

volumes:
  pgdata:

networks:
  default:
    name: app_default
    external: true

