# Docker Compose para a VPS existente
# Conecta à rede Docker compartilhada 'app_default' onde já roda o container 'algodoal-postgres'
services:
  algodoal-connect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algodoal-connect-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@algodoal-postgres:5432/algodoal_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default

networks:
  default:
    name: app_default
    external: true
